services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financial_companion
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial
    ports:
      - "5432:5432"
    volumes:
      - financial-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial_companion"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - financial-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  financial-postgres:
  financial-redis:
